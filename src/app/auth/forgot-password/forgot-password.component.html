<div class="login my-5 m-auto shadow bg-white">
  <h5 class="title mb-3">Email to change password</h5>
  <div class="container">
    <form
      class="login-form"
      [formGroup]="forgetPasswordForm"
      (ngSubmit)="forgetPassword()"
    >
      <div class="form-field">
        <mat-form-field appearance="outline">
          <mat-label>Enter your email</mat-label>
          <input
            matInput
            placeholder="pat@example.com"
            formControlName="email"
            name="email"
            id="email"
            (blur)="updateErrorMessage()"
            required
          />
          @if(forgetPasswordForm.get('email')?.hasError('required')) {
          <mat-error> Email is required </mat-error>
          } @if(forgetPasswordForm.get('email')?.hasError('email')) {
          <mat-error> Please enter a valid email </mat-error>
          }
        </mat-form-field>
      </div>
      @if(errorMessage()) {
      <div class="error my-3 py-3">
        <mat-error>{{ errorMessage() }}</mat-error>
      </div>
      }
      <div class="text-center">
        <button type="submit" class="btn">Send</button>
      </div>
      <div class="text-center">
        <p class="action-btn-link">
          Back to login?
          <b>
            <u class="action-btn" routerLink="/auth/login">Login</u>
          </b>
        </p>
      </div>
    </form>
  </div>
</div>
